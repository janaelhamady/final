{% extends 'courses/base.html' %}

{% block content %}

<div class="card">

    <h1>Create Account</h1>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button
            type="submit"
            class="btn"
        >
            Register
        </button>

    </form>

    <p>
        Already have an account?

        <a href="{% url 'login' %}">
            Login
        </a>
    </p>

</div>

{% endblock %}
