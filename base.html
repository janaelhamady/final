<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Course Manager</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333;
        }

        nav {
            background-color: #2563eb;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 15px;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
        }

        h1 {
            color: #1e40af;
        }

        .card {
            background-color: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .course-title {
            font-size: 22px;
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 10px;
        }

        .search-box {
            background-color: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        label {
            display: block;
            margin-top: 10px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .btn {
            display: inline-block;
            background-color: #2563eb;
            color: white;
            padding: 9px 15px;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #1d4ed8;
        }

        .btn-danger {
            background-color: #dc2626;
        }

        .muted {
            color: #777;
        }

    </style>

</head>


<body>

<nav>

    <div>

        <a href="{% url 'course_list' %}">
            Course Manager
        </a>

    </div>


    <div>

        {% if user.is_authenticated %}

            <a href="{% url 'profile' %}">
                {{ user.username }}
            </a>

            <form
                method="post"
                action="{% url 'logout' %}"
                style="display: inline;"
            >

                {% csrf_token %}

                <button
                    type="submit"
                    style="
                    background: none;
                    border: none;
                    color: white;
                    cursor: pointer;
                    font-weight: bold;
                    "
                >
                    Logout
                </button>

            </form>

        {% else %}

            <a href="{% url 'login' %}">
                Login
            </a>

            <a href="{% url 'register' %}">
                Register
            </a>

        {% endif %}

    </div>

</nav>


<div class="container">

    {% block content %}
    {% endblock %}

</div>


</body>

</html>
